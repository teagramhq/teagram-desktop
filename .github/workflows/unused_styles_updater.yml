name: Unused styles updater.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || github.workflow }}

on:
  repository_dispatch:
    types: ["Restart unused_styles_updater workflow."]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

jobs:
  Unused-styles:
    runs-on: ubuntu-26.04
    steps:
      - uses: desktop-app/action_code_updater@master
        with:
          type: "unused-styles"
