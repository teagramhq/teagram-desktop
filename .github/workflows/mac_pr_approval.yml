name: Clear macOS build approval.

on:
  pull_request_target:
    branches: [dev]
    types: [synchronize]

permissions:
  {}

# Runs with the base repository token so fork PRs are covered; it never checks
# out or runs PR code.
jobs:
  clear:
    name: Clear macOS build approval
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      pull-requests: write

    steps:
      - name: Cancel superseded MacOS. builds and clear their approval.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Refusing to edit a malformed pull request number."
            exit 1
          fi
          runs="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/mac.yml/runs" \
            -f event=pull_request -f branch="$HEAD_REF" -F per_page=100 \
            | jq -c --arg repo "$HEAD_REPOSITORY" '[.workflow_runs[] | select(.head_repository.full_name == $repo)]')"
          stale_run_ids="$(jq -r --arg sha "$HEAD_SHA" \
            '.[] | select(.status != "completed" and .head_sha != $sha) | .id' <<< "$runs")"
          while IFS= read -r run_id; do
            [[ -n "$run_id" ]] || continue
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected run ID from GitHub: $run_id"
              exit 1
            fi
            echo "Cancelling MacOS. run $run_id"
            if ! cancel_output="$(gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" 2>&1)"; then
              # A run that finished after the listing answers 409; nothing is left to cancel.
              if [[ "$cancel_output" != *"(HTTP 409)"* ]]; then
                printf '%s\n' "$cancel_output" >&2
                echo "::error::MacOS. run $run_id could not be cancelled."
                exit 1
              fi
              echo "MacOS. run $run_id already finished."
            fi
          done <<< "$stale_run_ids"

          # A run at the current head means macos-build was added for that head.
          if jq -e --arg sha "$HEAD_SHA" 'any(.[]; .head_sha == $sha)' <<< "$runs" >/dev/null; then
            echo "The current head already has a MacOS. run; keeping macos-build."
            exit 0
          fi
          if ! remove_output="$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/macos-build" 2>&1)"; then
            if [[ "$remove_output" != *"(HTTP 404)"* ]]; then
              printf '%s\n' "$remove_output" >&2
              echo "::error::Could not remove macos-build from PR $PR_NUMBER."
              exit 1
            fi
            echo "PR $PR_NUMBER has no macos-build label."
          fi
