name: Linux.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

on:
  pull_request:
  # The post-merge build runs on the push itself, so its check is attached to
  # the commit it checks out and its cache saves land in the dev scope. Keep
  # these paths in step with detect_linux_changes.sh.
  push:
    branches: [dev]
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - '!LEGAL'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/linux.yml'
      - '.github/scripts/detect_linux_changes.sh'
      - '.github/scripts/test_detect_linux_changes.sh'
      - '.github/scripts/linux_libraries_image.sh'
      - '.github/scripts/test_linux_libraries_image.sh'
      - '.github/scripts/verify_built_sha.sh'
      - '.github/scripts/test_verify_built_sha.sh'
      - '!snap/**'
      - '!Telegram/build/**'
      - 'Telegram/build/docker/centos_env/**'
      - 'Telegram/build/version'
      - 'Telegram/build/qt_version.py'
      - 'Telegram/build/teagram_update_manifest.py'
      - 'Telegram/build/changelog2appstream.py'
      - '!Telegram/Resources/uwp/**'
      - '!Telegram/Resources/winrc/**'
      - '!Telegram/SourceFiles/platform/win/**'
      - '!Telegram/SourceFiles/platform/mac/**'
      - '!Telegram/Telegram/**'
      - '!Telegram/configure.bat'
      - '!Telegram/Telegram.plist'
  # Keeps the default branch holding a live ccache for feature branches to restore
  # from, instead of leaving it to whenever someone last pushed to it. The restore
  # refreshes the entry's 7-day expiry; the save below only fires when the build
  # actually missed, so a quiet day costs nothing.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # One live build per branch and pull request. A new pull-request update
  # supersedes its prior run. The default branch is exempt so a cache-refreshing
  # build always finishes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:

  check-linux-changes:
    name: 'check: linux-changes'
    runs-on: ubuntu-26.04
    outputs:
      required: ${{ steps.filter.outputs.required }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Test Linux change detection.
        run: bash .github/scripts/test_detect_linux_changes.sh

      - name: Test brand art.
        run: bash .github/scripts/test_brand_art.sh

      - name: Detect Linux-relevant changes.
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/detect_linux_changes.sh

  # Trust boundary and token scope: see .github/ci-cache-threat-model.md.
  publish-linux-deps-image:
    name: 'publish: linux-deps-image'
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.repository == 'teagramhq/teagram-desktop'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clone.
        uses: actions/checkout@v7

      - name: Set Linux dependency image tag.
        id: image-tag
        env:
          DEPENDENCY_HASH: ${{ hashFiles('Telegram/build/docker/centos_env/**') }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPENDENCY_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Linux dependency image hash is missing or malformed."
            exit 1
          fi
          image="ghcr.io/teagramhq/teagram-desktop-linux-libraries:${DEPENDENCY_HASH}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "LINUX_LIBRARIES_IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing dependency image.
        id: image-cache
        run: bash .github/scripts/linux_libraries_image.sh inspect "$LINUX_LIBRARIES_IMAGE" "" "$GITHUB_OUTPUT"

      - name: Generate Dockerfile for a missing dependency image.
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Set up Docker Buildx for a missing dependency image.
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Linux dependency image.
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          push: true
          tags: ${{ steps.image-tag.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  test-linux-unit:
    name: "test: linux-unit (${{ matrix.defines || 'default' }})"
    # A dev push publishes the dependency image of this commit first, so the
    # build pulls the image for its own recipe. Other events skip the publisher.
    needs:
      - check-linux-changes
      - publish-linux-deps-image
    if: >
      !cancelled()
        && needs.check-linux-changes.result == 'success'
        && needs.check-linux-changes.outputs.required == 'true'
        && (needs.publish-linux-deps-image.result == 'success' || needs.publish-linux-deps-image.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      packages: read

    strategy:
      matrix:
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env
      # The dependency image and build need headroom beyond the checked-out
      # tree. Reclaim the runner only when less than this amount remains, and
      # fail closed if the headroom cannot be confirmed.
      MIN_FREE_SPACE_GIB: "30"

    steps:
      - name: Record Linux job start time.
        run: echo "LINUX_JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The check is reported against GITHUB_SHA, so the build must be of
      # exactly that commit.
      - name: Verify the checked-out commit.
        run: bash .github/scripts/verify_built_sha.sh "$GITHUB_SHA"

      - name: Set Linux dependency image tag.
        env:
          DEPENDENCY_HASH: ${{ hashFiles('Telegram/build/docker/centos_env/**') }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPENDENCY_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Linux dependency image hash is missing or malformed."
            exit 1
          fi
          echo "LINUX_LIBRARIES_IMAGE=ghcr.io/teagramhq/teagram-desktop-linux-libraries:${DEPENDENCY_HASH}" >> "$GITHUB_ENV"

      - name: Check free disk space before image preparation.
        id: disk-space-before
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${MIN_FREE_SPACE_GIB}" =~ ^[0-9]+$ ]]; then
            echo "::error::MIN_FREE_SPACE_GIB is not a non-negative integer: ${MIN_FREE_SPACE_GIB}"
            exit 1
          fi
          minimum_kib=$((MIN_FREE_SPACE_GIB * 1024 * 1024))

          if ! free_kib=$(df -Pk / | awk 'NR == 2 { print $4; exit }'); then
            echo "::error::Unable to measure free disk space on the runner."
            exit 1
          fi
          if [[ ! "${free_kib}" =~ ^[0-9]+$ ]]; then
            echo "::error::Free disk space measurement was unavailable: '${free_kib}'"
            exit 1
          fi

          free_gib=$((free_kib / 1024 / 1024))
          echo "Free disk space before image preparation: ${free_gib} GiB (${free_kib} KiB). Minimum: ${MIN_FREE_SPACE_GIB} GiB (${minimum_kib} KiB)."
          echo "free_kib=${free_kib}" >> "${GITHUB_OUTPUT}"
          if (( free_kib < minimum_kib )); then
            echo "cleanup_required=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Disk cleanup required: ${free_gib} GiB is below the ${MIN_FREE_SPACE_GIB} GiB minimum."
          else
            echo "cleanup_required=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Disk cleanup skipped: ${free_gib} GiB is at or above the ${MIN_FREE_SPACE_GIB} GiB minimum."
          fi

      - name: Free up some disk space when needed.
        if: steps.disk-space-before.outputs.cleanup_required == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Verify free disk space after cleanup.
        if: steps.disk-space-before.outputs.cleanup_required == 'true'
        id: disk-space-after
        shell: bash
        run: |
          set -euo pipefail

          minimum_kib=$((MIN_FREE_SPACE_GIB * 1024 * 1024))
          if ! free_kib=$(df -Pk / | awk 'NR == 2 { print $4; exit }'); then
            echo "::error::Unable to measure free disk space after cleanup."
            exit 1
          fi
          if [[ ! "${free_kib}" =~ ^[0-9]+$ ]]; then
            echo "::error::Free disk space measurement after cleanup was unavailable: '${free_kib}'"
            exit 1
          fi

          free_gib=$((free_kib / 1024 / 1024))
          echo "Free disk space after cleanup: ${free_gib} GiB (${free_kib} KiB). Minimum: ${MIN_FREE_SPACE_GIB} GiB (${minimum_kib} KiB)."
          echo "free_kib=${free_kib}" >> "${GITHUB_OUTPUT}"
          if (( free_kib < minimum_kib )); then
            echo "::error::Free disk space remains below the ${MIN_FREE_SPACE_GIB} GiB minimum after cleanup."
            exit 1
          fi

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV

      - name: Verify free disk space before dependency image use.
        shell: bash
        run: |
          set -euo pipefail

          minimum_kib=$((MIN_FREE_SPACE_GIB * 1024 * 1024))
          if ! free_kib=$(df -Pk / | awk 'NR == 2 { print $4; exit }'); then
            echo "::error::Unable to measure free disk space before the dependency image build."
            exit 1
          fi
          if [[ ! "${free_kib}" =~ ^[0-9]+$ ]]; then
            echo "::error::Free disk space measurement before the dependency image build was unavailable: '${free_kib}'"
            exit 1
          fi

          free_gib=$((free_kib / 1024 / 1024))
          echo "Free disk space before dependency image build: ${free_gib} GiB (${free_kib} KiB). Minimum: ${MIN_FREE_SPACE_GIB} GiB (${minimum_kib} KiB)."
          if (( free_kib < minimum_kib )); then
            echo "::error::Free disk space fell below the ${MIN_FREE_SPACE_GIB} GiB minimum before the dependency image build."
            exit 1
          fi

      - name: Log in to GitHub Container Registry.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Linux Libraries timer.
        run: echo "LINUX_LIBRARIES_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Pull shared Linux dependency image.
        id: pull-libraries
        run: bash .github/scripts/linux_libraries_image.sh pull "$LINUX_LIBRARIES_IMAGE" "$IMAGE_TAG" "$GITHUB_OUTPUT"

      - name: Generate Dockerfile for a missing dependency image.
        if: steps.pull-libraries.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Set up Docker Buildx for a missing dependency image.
        if: steps.pull-libraries.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Libraries.
        id: libraries
        if: steps.pull-libraries.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Report Linux Libraries duration.
        if: always()
        env:
          IMAGE_CACHE_HIT: ${{ steps.pull-libraries.outputs.cache-hit }}
        run: |
          set -euo pipefail
          finished_at="$(date -u +%s)"
          started_at="${LINUX_LIBRARIES_STARTED_AT:-$finished_at}"
          elapsed_seconds=$((finished_at - started_at))
          printf 'Linux Libraries phase: %s seconds (%s minutes), image cache hit: %s.\n' \
            "$elapsed_seconds" "$((elapsed_seconds / 60))" "${IMAGE_CACHE_HIT:-unknown}"
          printf '### Linux Libraries phase\n\n- Duration: %s seconds (%s minutes)\n- GHCR image hit: %s\n\n' \
            "$elapsed_seconds" "$((elapsed_seconds / 60))" "${IMAGE_CACHE_HIT:-unknown}" \
            >> "$GITHUB_STEP_SUMMARY"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" \
              && "${IMAGE_CACHE_HIT:-false}" == "true" \
              && "$elapsed_seconds" -ge 300 ]]; then
            echo "::warning::Warm Linux Libraries pull exceeded the five-minute target (${elapsed_seconds}s)."
          fi

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'default' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'default' }}-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Teagram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Teagram" >> $GITHUB_ENV
          fi

          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Debug \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Debug \
          -D CMAKE_C_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_CXX_FLAGS_DEBUG="-O0 -fpch-preprocess" \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF \
          $DEFINE

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.event_name != 'pull_request'
            && github.ref == 'refs/heads/dev'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: ccache --evict-older-than 1d

      - name: Save Telegram Desktop cache.
        if: >
          env.ONLY_CACHE == 'false'
            && github.event_name != 'pull_request'
            && github.ref == 'refs/heads/dev'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/Debug/Teagram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"

            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
          else
            echo "Build error, output file does not exist."
            exit 1
          fi
          if test -e out/Debug/Updater; then
            echo "Linux Teagram build unexpectedly contains an updater."
            exit 1
          fi

      # Runs in the same image the client was built in, so the test binary
      # links against the libraries it was compiled against. The build above
      # already produced it, so this only executes it: seconds, not a second
      # compile. Placed before the artifact steps so a red test stops the
      # upload rather than shipping a binary nothing checked.
      # Linux ships Teagram without an updater, so CI gates the standalone
      # unit cases without running the desktop GUI regression under Xvfb.
      - name: Unit tests.
        if: env.ONLY_CACHE == 'false'
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          $IMAGE_TAG \
          bash -lc '
            cd /usr/src/tdesktop
            test_unit=/usr/src/tdesktop/out/Debug/test_unit
            "$test_unit"
            TEST_STATUS=$?
            if test "$TEST_STATUS" -ne 0; then
              exit "$TEST_STATUS"
            fi

            if selected_output=$("$test_unit" --case EveryUpdaterEntryPointIsDenied 2>&1); then
              printf "%s\n" "$selected_output"
            else
              TEST_STATUS=$?
              printf "%s\n" "$selected_output"
              exit "$TEST_STATUS"
            fi
            case_runs=$(printf "%s\n" "$selected_output" | sed -n "/^run  /p")
            if test "$case_runs" != "run  EveryUpdaterEntryPointIsDenied"; then
              echo "--case did not run exactly EveryUpdaterEntryPointIsDenied."
              exit 1
            fi
            if ! printf "%s\n" "$selected_output" | grep -Fqx "1 case(s), 0 failed, 0 failed check(s)."; then
              echo "--case did not report one passing case."
              exit 1
            fi

            if missing_output=$("$test_unit" --case NoSuchUpdaterCase 2>&1); then
              printf "%s\n" "$missing_output"
              echo "An unknown --case selection unexpectedly succeeded."
              exit 1
            fi
            printf "%s\n" "$missing_output"
            if ! printf "%s\n" "$missing_output" | grep -Fqx "No test case named NoSuchUpdaterCase is registered."; then
              echo "Unknown --case selection did not report a missing case."
              exit 1
            fi
            if printf "%s\n" "$missing_output" | grep -q "^run  "; then
              echo "Unknown --case selection ran a test case."
              exit 1
            fi
            if ! printf "%s\n" "$missing_output" | grep -Fqx "0 case(s), 0 failed, 0 failed check(s)."; then
              echo "Unknown --case selection did not report zero cases."
              exit 1
            fi

            if selected_output=$("$test_unit" --case LinuxTeagramDataPathAvoidsTelegramFolders 2>&1); then
              printf "%s\n" "$selected_output"
            else
              TEST_STATUS=$?
              printf "%s\n" "$selected_output"
              exit "$TEST_STATUS"
            fi
            case_runs=$(printf "%s\n" "$selected_output" | sed -n "/^run  /p")
            if test "$case_runs" != "run  LinuxTeagramDataPathAvoidsTelegramFolders"; then
              echo "--case did not run exactly LinuxTeagramDataPathAvoidsTelegramFolders."
              exit 1
            fi
            if ! printf "%s\n" "$selected_output" | grep -Fqx "1 case(s), 0 failed, 0 failed check(s)."; then
              echo "Linux Teagram data path case did not report one passing case."
              exit 1
            fi

            if selected_output=$("$test_unit" --case LinuxTeagramDesktopIdentityUsesPrivateNames 2>&1); then
              printf "%s\n" "$selected_output"
            else
              TEST_STATUS=$?
              printf "%s\n" "$selected_output"
              exit "$TEST_STATUS"
            fi
            case_runs=$(printf "%s\n" "$selected_output" | sed -n "/^run  /p")
            if test "$case_runs" != "run  LinuxTeagramDesktopIdentityUsesPrivateNames"; then
              echo "--case did not run exactly LinuxTeagramDesktopIdentityUsesPrivateNames."
              exit 1
            fi
            if ! printf "%s\n" "$selected_output" | grep -Fqx "1 case(s), 0 failed, 0 failed check(s)."; then
              echo "Linux Teagram desktop identity case did not report one passing case."
              exit 1
            fi

            if selected_output=$("$test_unit" --case LinuxTeagramLauncherCommandsUseAbsoluteExecutableOutsidePath 2>&1); then
              printf "%s\n" "$selected_output"
            else
              TEST_STATUS=$?
              printf "%s\n" "$selected_output"
              exit "$TEST_STATUS"
            fi
            case_runs=$(printf "%s\n" "$selected_output" | sed -n "/^run  /p")
            if test "$case_runs" != "run  LinuxTeagramLauncherCommandsUseAbsoluteExecutableOutsidePath"; then
              echo "--case did not run exactly LinuxTeagramLauncherCommandsUseAbsoluteExecutableOutsidePath."
              exit 1
            fi
            if ! printf "%s\n" "$selected_output" | grep -Fqx "1 case(s), 0 failed, 0 failed check(s)."; then
              echo "Linux Teagram launcher executable path case did not report one passing case."
              exit 1
            fi

            if selected_output=$("$test_unit" --case LinuxTeagramTryExecRemainsRawForSpacedPath 2>&1); then
              printf "%s\n" "$selected_output"
            else
              TEST_STATUS=$?
              printf "%s\n" "$selected_output"
              exit "$TEST_STATUS"
            fi
            case_runs=$(printf "%s\n" "$selected_output" | sed -n "/^run  /p")
            if test "$case_runs" != "run  LinuxTeagramTryExecRemainsRawForSpacedPath"; then
              echo "--case did not run exactly LinuxTeagramTryExecRemainsRawForSpacedPath."
              exit 1
            fi
            if ! printf "%s\n" "$selected_output" | grep -Fqx "1 case(s), 0 failed, 0 failed check(s)."; then
              echo "Linux Teagram spaced-path launcher case did not report one passing case."
              exit 1
            fi

            if selected_output=$("$test_unit" --case SignupTermsHappyPathSmoke 2>&1); then
              printf "%s\n" "$selected_output"
            else
              TEST_STATUS=$?
              printf "%s\n" "$selected_output"
              exit "$TEST_STATUS"
            fi
            case_runs=$(printf "%s\n" "$selected_output" | sed -n "/^run  /p")
            if test "$case_runs" != "run  SignupTermsHappyPathSmoke"; then
              echo "--case did not run exactly SignupTermsHappyPathSmoke."
              exit 1
            fi
            if ! printf "%s\n" "$selected_output" | grep -Fqx "1 case(s), 0 failed, 0 failed check(s)."; then
              echo "Signup terms smoke case did not report one passing case."
              exit 1
            fi
          '

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd out/Debug
          mkdir artifact
          mv Teagram artifact/
      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/Debug/artifact/

      - name: Report Actions cache total.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          finished_at="$(date -u +%s)"
          started_at="${LINUX_JOB_STARTED_AT:-$finished_at}"
          job_elapsed_seconds=$((finished_at - started_at))
          printf 'Linux build job duration: %s seconds (%s minutes).\n' \
            "$job_elapsed_seconds" "$((job_elapsed_seconds / 60))"
          printf '### Linux build job\n\n- Duration: %s seconds (%s minutes)\n\n' \
            "$job_elapsed_seconds" "$((job_elapsed_seconds / 60))" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] \
              && (( job_elapsed_seconds >= 1200 )); then
            echo "::warning::Linux PR build job exceeded the 20-minute target (${job_elapsed_seconds}s)."
          fi
          if ! cache_sizes="$(gh cache list --limit 1000 --json sizeInBytes --jq '.[].sizeInBytes' --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            echo "::warning::Unable to read the Actions cache total: ${cache_sizes}"
            printf '### Actions cache budget\n\n- Total: unavailable\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total_bytes=0
          if [[ -n "$cache_sizes" ]]; then
            while IFS= read -r cache_size; do
              if [[ ! "$cache_size" =~ ^[0-9]+$ ]]; then
                echo "::warning::Ignoring an invalid Actions cache size: ${cache_size}"
                continue
              fi
              total_bytes=$((total_bytes + cache_size))
            done <<< "$cache_sizes"
          fi
          total_gib="$(awk -v bytes="$total_bytes" 'BEGIN { printf "%.2f", bytes / 1073741824 }')"
          printf 'Actions cache total: %s bytes (%s GiB).\n' "$total_bytes" "$total_gib"
          printf '### Actions cache budget\n\n- Total: %s bytes (%s GiB)\n- Target: under 9000000000 bytes (9 GB)\n' \
            "$total_bytes" "$total_gib" >> "$GITHUB_STEP_SUMMARY"
          if (( total_bytes >= 9000000000 )); then
            echo "::warning::Actions cache total is at or above the 9 GB target (${total_bytes} bytes)."
          fi

  check-linux:
    name: Rocky Linux 8
    needs:
      - check-linux-changes
      - test-linux-unit
    if: ${{ (github.event_name == 'pull_request' && !cancelled()) || (github.event_name != 'pull_request' && always()) }}
    runs-on: ubuntu-26.04

    steps:
      - name: Report Linux check result.
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.check-linux-changes.result }}
          BUILD_REQUIRED: ${{ needs.check-linux-changes.outputs.required }}
          BUILD_RESULT: ${{ needs.test-linux-unit.result }}
        run: |
          set -euo pipefail

          if [[ "${CHANGE_RESULT}" != "success" ]]; then
            echo "::error::Unable to determine whether the Linux build is required."
            exit 1
          fi

          case "${BUILD_REQUIRED}" in
            false)
              echo "No Linux-relevant files changed; Linux check passed without a build."
              ;;
            true)
              if [[ "${BUILD_RESULT}" != "success" ]]; then
                echo "::error::Linux build and unit tests did not succeed (result: ${BUILD_RESULT})."
                exit 1
              fi
              echo "Rocky Linux 8 build and unit tests passed."
              ;;
            *)
              echo "::error::Linux build requirement was not reported."
              exit 1
              ;;
          esac

  ci:
    name: ci
    needs:
      - check-linux-changes
      - test-linux-unit
      - check-linux
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04

    steps:
      - name: Report CI result.
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.check-linux-changes.result }}
          BUILD_REQUIRED: ${{ needs.check-linux-changes.outputs.required }}
          BUILD_RESULT: ${{ needs.test-linux-unit.result }}
          LINUX_RESULT: ${{ needs.check-linux.result }}
        run: |
          set -euo pipefail

          if [[ "${CHANGE_RESULT}" != "success" ]]; then
            echo "::error::Unable to determine whether the Linux build is required."
            exit 1
          fi

          if [[ "${LINUX_RESULT}" != "success" ]]; then
            echo "::error::Linux check did not succeed (result: ${LINUX_RESULT})."
            exit 1
          fi

          case "${BUILD_REQUIRED}" in
            false)
              if [[ "${BUILD_RESULT}" != "skipped" ]]; then
                echo "::error::Linux build was not skipped as expected (result: ${BUILD_RESULT})."
                exit 1
              fi
              echo "All required pull request checks passed; Linux build was not required."
              ;;
            true)
              if [[ "${BUILD_RESULT}" != "success" ]]; then
                echo "::error::Linux build and unit tests did not succeed (result: ${BUILD_RESULT})."
                exit 1
              fi
              echo "All required pull request checks passed."
              ;;
            *)
              echo "::error::Linux build requirement was not reported."
              exit 1
              ;;
          esac
