name: Unit feedback.

run-name: ${{ inputs.issue && format('{0} [{1}]', github.workflow, inputs.issue) || '' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch name or commit SHA to test.
        required: true
        default: dev
        type: string
      cases:
        description: Exact case names separated by whitespace; empty runs all cases.
        required: false
        default: ''
        type: string
      issue:
        description: "Issue key to report this run to (e.g. MAIN-123). Leave empty for no report."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

# The lane runs on dev while building a selected feature ref, so its cache
# token carries the dev scope. Read-only access keeps that ref from planting
# entries trusted dev builds restore. See .github/ci-cache-threat-model.md.
cache-mode: read

jobs:

  test-linux-unit-feedback:
    name: 'test: linux-unit-feedback'
    runs-on: ubuntu-26.04
    timeout-minutes: 240

    env:
      CONFIG: Debug
      IMAGE_TAG: tdesktop:centos_env
      UNIT_CASES: ${{ inputs.cases }}

    steps:
      - name: Checkout metadata inspector.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .unit-feedback-tools
          sparse-checkout: |
            .github/scripts/unit_feedback_metadata.py
            .github/scripts/linux_libraries_image.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Retain metadata inspector.
        run: |
          install -m 0444 .unit-feedback-tools/.github/scripts/unit_feedback_metadata.py "$RUNNER_TEMP/unit_feedback_metadata.py"
          install -m 0444 .unit-feedback-tools/.github/scripts/linux_libraries_image.sh "$RUNNER_TEMP/linux_libraries_image.sh"

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Record tested revision.
        run: |
          tested_sha=$(git rev-parse HEAD)
          echo "TESTED_SHA=$tested_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$tested_sha" > "$RUNNER_TEMP/tested-sha.txt"
          printf '{"schema_version":1,"status":"failed","failure":"metadata inspection has not run"}\n' \
            > "$RUNNER_TEMP/unit-environment.json"
          printf '%s\n' 'unavailable: dependency image has not been loaded' \
            > "$RUNNER_TEMP/unit-feedback-image-id.txt"

      - name: Validate case selection.
        shell: bash
        run: |
          set -euo pipefail
          case_input="${UNIT_CASES//$'\n'/ }"
          read -r -a selected_cases <<< "$case_input"
          if [[ -n "$UNIT_CASES" && ${#selected_cases[@]} -eq 0 ]] \
            || (( ${#selected_cases[@]} > 32 )); then
            echo "::error::Select between 1 and 32 exact case names, or leave cases empty."
            exit 1
          fi
          for selected_case in "${selected_cases[@]}"; do
            if [[ ! "$selected_case" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::Case names must be C++ identifiers."
              exit 1
            fi
          done
          : > "$RUNNER_TEMP/unit-cases.txt"
          if (( ${#selected_cases[@]} > 0 )); then
            printf '%s\n' "${selected_cases[@]}" > "$RUNNER_TEMP/unit-cases.txt"
          fi

      - name: Set Linux dependency image tag.
        env:
          DEPENDENCY_HASH: ${{ hashFiles('Telegram/build/docker/centos_env/**') }}
        run: |
          set -euo pipefail
          if [[ ! "${DEPENDENCY_HASH}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Linux dependency image hash is missing or malformed."
            exit 1
          fi
          echo "LINUX_LIBRARIES_IMAGE=ghcr.io/teagramhq/teagram-desktop-linux-libraries:${DEPENDENCY_HASH}" >> "$GITHUB_ENV"

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Log in to GitHub Container Registry.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pulls the image dev's Linux libraries publisher pushed for this recipe.
      # Only a missing tag falls back to a local build; a registry error fails.
      - name: Pull shared Linux dependency image.
        id: pull-libraries
        run: bash "$RUNNER_TEMP/linux_libraries_image.sh" pull "$LINUX_LIBRARIES_IMAGE" "$IMAGE_TAG" "$GITHUB_OUTPUT"

      - name: Generate Dockerfile for a missing dependency image.
        if: steps.pull-libraries.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Set up Docker Buildx for a missing dependency image.
        if: steps.pull-libraries.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      # No exported BuildKit cache is used here, and the image is loaded
      # locally, never pushed, so a feature ref cannot write shared state.
      - name: Libraries.
        if: steps.pull-libraries.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Record dependency image.
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format='{{.Id}}' "$IMAGE_TAG")"
          if [[ -z "$image_id" ]]; then
            echo "::error::The loaded dependency image has no ID."
            exit 1
          fi
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          printf '%s\n' "$image_id" > "$RUNNER_TEMP/unit-feedback-image-id.txt"

      - name: Unit tests.
        timeout-minutes: 30
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/test_unit.log"
          metadata="$RUNNER_TEMP/unit-environment.json"
          : > "$metadata"

          set +e
          docker run --rm \
            -u "$(id -u)" \
            -v "$PWD:/usr/src/tdesktop" \
            -v "$RUNNER_TEMP/unit-cases.txt:/tmp/unit-cases.txt:ro" \
            -v "$RUNNER_TEMP/unit_feedback_metadata.py:/tmp/unit_feedback_metadata.py:ro" \
            -v "$metadata:/tmp/unit-environment.json" \
            -e CONFIG="$CONFIG" \
            -e TESTED_SHA="$TESTED_SHA" \
            -e IMAGE_TAG="$IMAGE_TAG" \
            -e IMAGE_ID="$IMAGE_ID" \
            "$IMAGE_TAG" \
            bash -lc '
              set -euo pipefail
              cd /usr/src/tdesktop/Telegram
              mkdir -p ../out/.cmake/api/v1/query
              : > ../out/.cmake/api/v1/query/codemodel-v2
              ./configure.sh \
                -D CMAKE_CONFIGURATION_TYPES=Debug \
                -D TDESKTOP_API_TEST=ON
              cmake --build ../out --config "$CONFIG" --target test_unit
              inspection_status=0
              timeout --signal=KILL 300s python3 /tmp/unit_feedback_metadata.py \
                --output /tmp/unit-environment.json \
                --source /usr/src/tdesktop \
                --build /usr/src/tdesktop/out \
                --test-unit /usr/src/tdesktop/out/Debug/test_unit \
                --cases /tmp/unit-cases.txt \
                --tested-sha "$TESTED_SHA" \
                --image-tag "$IMAGE_TAG" \
                --image-id "$IMAGE_ID" || inspection_status=$?
              if [ "$inspection_status" -ne 0 ]; then
                python3 /tmp/unit_feedback_metadata.py \
                  --mark-failure \
                  --output /tmp/unit-environment.json \
                  --tested-sha "$TESTED_SHA" \
                  --image-tag "$IMAGE_TAG" \
                  --image-id "$IMAGE_ID" \
                  --exit-code "$inspection_status" || true
                echo "::error::Unit environment metadata inspection failed (exit $inspection_status)."
              fi
              if [ -s /tmp/unit-cases.txt ]; then
                batch_status=0
                while IFS= read -r selected_case; do
                  case_status=0
                  "../out/$CONFIG/test_unit" --case "$selected_case" || case_status=$?
                  printf "case_exit %s %s\n" "$selected_case" "$case_status"
                  if [ "$case_status" -ne 0 ]; then
                    batch_status=1
                  fi
                done < /tmp/unit-cases.txt
                exit "$batch_status"
              else
                "../out/$CONFIG/test_unit"
              fi
            ' 2>&1 | tee "$log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test_status=${pipeline_status[0]}
          if [ "${pipeline_status[1]}" -ne 0 ]; then
            echo "::error::Unable to retain the test_unit log."
            exit 1
          fi

          if [ ! -s "$metadata" ]; then
            printf '{"schema_version":1,"status":"failed","failure":"Docker did not retain the metadata inspection output","expected_sha":"%s","image_id":"%s","container_exit_code":%s}\n' \
              "$TESTED_SHA" "$IMAGE_ID" "$test_status" > "$metadata"
          fi
          metadata_size=$(wc -c < "$metadata")
          if [ "$metadata_size" -gt 1048576 ]; then
            printf '{"schema_version":1,"status":"incomplete","failure":"metadata exceeded the 1 MiB output limit","expected_sha":"%s","image_id":"%s","observed_bytes":%s}\n' \
              "$TESTED_SHA" "$IMAGE_ID" "$metadata_size" > "$metadata"
          fi
          metadata_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", "invalid"))' "$metadata" 2>/dev/null || printf invalid)"
          if [ "$metadata_status" = invalid ]; then
            printf '{"schema_version":1,"status":"failed","failure":"metadata output was not valid JSON","expected_sha":"%s","image_id":"%s","observed_bytes":%s}\n' \
              "$TESTED_SHA" "$IMAGE_ID" "$metadata_size" > "$metadata"
            metadata_status=failed
          fi
          if [ "$metadata_status" != complete ]; then
            echo "::error::Unit environment metadata inspection is $metadata_status."
          fi

          summary="$(sed -nE \
            's/^([0-9]+) case\(s\), ([0-9]+) failed, ([0-9]+) failed check\(s\)\.$/\1 \2 \3/p' \
            "$log" | awk '
              { cases += $1; failed += $2; checks += $3; summaries++ }
              END { if (summaries) print cases, failed, checks, summaries }
            ')"
          if [ -z "$summary" ]; then
            echo "::error::test_unit did not report a case summary."
            {
              echo "## Unit feedback"
              echo
              echo "- Revision: \`$TESTED_SHA\`"
              echo "- Result: no case summary (failure)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          read -r cases failed failed_checks summaries <<< "$summary"
          requested_cases=$(wc -l < "$RUNNER_TEMP/unit-cases.txt")
          {
            echo "## Unit feedback"
            echo
            echo "- Revision: \`$TESTED_SHA\`"
            echo "- Cases: $cases"
            echo "- Failed cases: $failed"
            echo "- Failed checks: $failed_checks"
            echo "- Environment metadata: $metadata_status"
            if [ "$requested_cases" -gt 0 ]; then
              echo
              echo "Requested case names:"
              sed 's/^/- /' "$RUNNER_TEMP/unit-cases.txt"
            fi
            if [ "$failed" -gt 0 ]; then
              echo
              echo "Failed case names:"
              sed -n 's/^FAIL /- /p' "$log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$requested_cases" -gt 0 ] \
            && { [ "$summaries" -ne "$requested_cases" ] || [ "$cases" -ne "$requested_cases" ]; }; then
            echo "::error::Each requested case must report exactly one executed case."
            exit 1
          fi
          if [ "$metadata_status" != complete ]; then
            exit 1
          fi
          if [ "$test_status" -eq 0 ] \
            && [ "$cases" -gt 0 ] \
            && [ "$failed" -eq 0 ] \
            && [ "$failed_checks" -eq 0 ]; then
            exit 0
          fi
          if [ "$test_status" -eq 0 ]; then
            exit 1
          fi
          exit "$test_status"

      - name: Upload unit feedback.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-feedback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unit-environment.json
            ${{ runner.temp }}/unit-feedback-image-id.txt
            ${{ runner.temp }}/test_unit.log
            ${{ runner.temp }}/unit-cases.txt
            ${{ runner.temp }}/tested-sha.txt
          retention-days: 7
