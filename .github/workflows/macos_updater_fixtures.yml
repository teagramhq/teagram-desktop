name: MacOS updater fixtures.

on:
  pull_request:
    branches: [dev]
    paths:
      - 'Telegram/SourceFiles/core/teagram_update_*'
      - 'Telegram/SourceFiles/core/mac_protected_path_access.h'
      - 'Telegram/SourceFiles/core/mac_protected_path_runtime.h'
      - 'Telegram/SourceFiles/tests/unit/teagram_update_*_tests.cpp'
      - 'Telegram/SourceFiles/tests/unit/mac_protected_path_runtime_stub.cpp'
      - 'Telegram/SourceFiles/tests/unit/mac_file_bookmark_stub.cpp'
      - 'Telegram/SourceFiles/tests/unit/unit_test.cpp'
      - 'Telegram/SourceFiles/tests/unit/unit_test.h'
      - 'Telegram/cmake/**'
      - 'Telegram/build/prepare/mac.sh'
      - 'Telegram/build/prepare/prepare.py'
      - 'Telegram/build/qt_version.py'
      - 'Telegram/build/teagram_update_manifest.py'
      - '.github/scripts/run_teagram_updater_fixtures.sh'
      - '.github/scripts/test_macos_ci_contract.sh'
      - '.github/workflows/macos_updater_fixtures.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  updater-fixtures:
    name: macOS arm64 updater fixtures
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Require an arm64 runner.
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          echo "Runner architecture: $architecture"
          test "$architecture" = arm64

      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"

      - name: Check out the exact PR merge ref.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Depth 2 fetches both parents so the next step can check them.
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
          path: ${{ env.REPO_NAME }}

      - name: Verify the checked out PR merge ref.
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C "$REPO_NAME" rev-parse HEAD)"
          test "$checked_out_sha" = "$EXPECTED_MERGE_SHA"
          read -r -a parents <<< "$(git -C "$REPO_NAME" show -s --format=%P HEAD)"
          test "${#parents[@]}" = 2
          test "${parents[1]}" = "$EXPECTED_HEAD_SHA"
          printf 'Tested PR merge ref: %s (base %s, head %s)\n' \
            "$checked_out_sha" "${parents[0]}" "${parents[1]}"
          mkdir -p "$RUNNER_TEMP/teagram-updater-fixtures"
          printf 'tested_sha=%s\nbase_sha=%s\nhead_sha=%s\n' \
            "$checked_out_sha" "${parents[0]}" "${parents[1]}" \
            > "$RUNNER_TEMP/teagram-updater-fixtures/revision.txt"

      - name: Set macOS dependency image tag.
        env:
          DEPENDENCY_HASH: ${{ hashFiles(format('{0}/Telegram/build/prepare/prepare.py', env.REPO_NAME), format('{0}/Telegram/build/prepare/mac.sh', env.REPO_NAME), format('{0}/Telegram/build/qt_version.py', env.REPO_NAME)) }}
        run: bash "$REPO_NAME/.github/scripts/macos_libraries_image.sh" set-image

      - name: Set up build tools and Xcode.
        run: |
          set -euo pipefail
          sudo chown -R "$(whoami)":admin /usr/local/share

          missing=()
          for formula in automake libtool meson nasm ninja pkg-config oras zstd; do
            if ! brew list --formula "$formula" >/dev/null 2>&1; then
              missing+=("$formula")
            fi
          done
          if ((${#missing[@]})); then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"
          fi

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Log in to GitHub Container Registry.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Restore macOS libraries artifact.
        id: cache-libs
        run: bash "$REPO_NAME/.github/scripts/macos_libraries_image.sh" pull "$MACOS_LIBRARIES_IMAGE" "$GITHUB_WORKSPACE/$REPO_NAME" "$GITHUB_OUTPUT"

      - name: Restore legacy macOS libraries cache.
        id: legacy-cache-libs
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: macOS-libs-${{ hashFiles(format('{0}/Telegram/build/prepare/prepare.py', env.REPO_NAME), format('{0}/Telegram/build/prepare/mac.sh', env.REPO_NAME), format('{0}/Telegram/build/qt_version.py', env.REPO_NAME)) }}

      - name: Prepare libraries.
        id: libraries
        if: steps.cache-libs.outputs.cache-hit != 'true' && steps.legacy-cache-libs.outputs.cache-hit != 'true'
        run: ./$REPO_NAME/Telegram/build/prepare/mac.sh skip-release silent

      - name: Configure updater fixture runner.
        id: configure
        run: |
          set -euo pipefail
          cd "$REPO_NAME/Telegram"
          configure_log="$RUNNER_TEMP/teagram-updater-fixtures/configure.log"
          set +e
          ./configure.sh \
            -G "Ninja Multi-Config" \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_CONFIGURATION_TYPES=Debug \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_TEST=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF 2>&1 \
            | tail -c 65536 \
            | tee "$configure_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          configure_status="${pipeline_status[0]}"
          if [[ "${pipeline_status[1]}" != 0 || "${pipeline_status[2]}" != 0 ]]; then
            configure_status=1
          fi
          printf 'configure_exit_status=%s\n' "$configure_status" \
            >> "$RUNNER_TEMP/teagram-updater-fixtures/revision.txt"
          if ((configure_status != 0)); then
            echo "::error::Updater fixture configure failed; bounded output is in the updater fixture artifact."
            exit "$configure_status"
          fi

      - name: Build updater fixture runner.
        id: build-fixtures
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/teagram-updater-fixtures/build.log"
          set +e
          cmake --build "$REPO_NAME/out" \
            --config Debug \
            --target test_unit \
            --parallel 2 2>&1 \
            | tail -c 65536 \
            | tee "$build_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          build_status="${pipeline_status[0]}"
          if [[ "${pipeline_status[1]}" != 0 || "${pipeline_status[2]}" != 0 ]]; then
            build_status=1
          fi
          printf 'build_exit_status=%s\n' "$build_status" \
            >> "$RUNNER_TEMP/teagram-updater-fixtures/revision.txt"
          if ((build_status != 0)); then
            echo "::error::test_unit build failed; bounded output is in the updater fixture artifact."
            exit "$build_status"
          fi

      - name: Canonicalize the fixture temporary directory.
        run: |
          set -euo pipefail
          canonical_tmpdir="$(cd "$TMPDIR" && pwd -P)"
          printf 'TMPDIR=%s\n' "$canonical_tmpdir" >> "$GITHUB_ENV"
          printf 'Fixture temporary directory: %s\n' "$canonical_tmpdir"

      - name: Run focused updater fixtures.
        id: fixtures
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          bash "$REPO_NAME/.github/scripts/run_teagram_updater_fixtures.sh" \
            "$REPO_NAME/out/Debug/test_unit" \
            "$RUNNER_TEMP/teagram-updater-fixtures"

      - name: Upload updater fixture diagnostics.
        if: ${{ always() && steps.configure.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: teagram-updater-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/teagram-updater-fixtures/
          if-no-files-found: error
          retention-days: 14
