name: Claude review.

# Advisory deep review of changes to risky code. Only BLOCKING turns the check
# red; a missing verdict, timeout, auth or quota error passes with a warning.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - '.github/claude-review.md'
      - '.github/scripts/claude_review_verdict.py'
      - 'Telegram/SourceFiles/core/teagram_update_*'
      - 'Telegram/SourceFiles/core/update_checker.*'
      - 'Telegram/SourceFiles/core/update_policy.h'
      - 'Telegram/SourceFiles/_other/updater*'
      - 'Telegram/SourceFiles/_other/packer.*'
      - 'Telegram/build/teagram_update_manifest.py'
      - 'Telegram/build/teagram_update_public_key.pem'
      - 'Telegram/SourceFiles/mtproto/**'
      - 'Telegram/SourceFiles/storage/details/storage_file_utilities.*'
      - 'Telegram/SourceFiles/storage/storage_domain.*'
      - 'Telegram/SourceFiles/core/launcher.*'
      - 'Telegram/SourceFiles/platform/*/launcher_*'
      - 'Telegram/SourceFiles/core/mac_protected_path_*'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # CLAUDE_REVIEW_ENABLED is the budget switch, flipped in repo settings.
    # Fork PRs get no secrets; drafts are reviewed once marked ready.
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review the diff
        id: claude
        # Leaves headroom under the job timeout so a slow review is neutral.
        timeout-minutes: 16
        continue-on-error: true
        uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1.0.251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Follow the instructions in .github/claude-review.md.
            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
            Base commit: ${{ github.event.pull_request.base.sha }}
            Head commit: ${{ github.event.pull_request.head.sha }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*)"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"

      - name: Read the verdict
        id: verdict
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/claude_review_verdict.py "$EXECUTION_FILE" "$RUNNER_TEMP/claude-review.md"

      - name: Post the review
        if: steps.verdict.outputs.verdict != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment --body-file "$RUNNER_TEMP/claude-review.md" \
            || echo "::warning::Could not post the Claude review comment."

      - name: Fail on blocking findings
        if: steps.verdict.outputs.verdict == 'blocking'
        run: |
          cat "$RUNNER_TEMP/claude-review.md"
          echo "::error::Claude review found blocking defects."
          exit 1
