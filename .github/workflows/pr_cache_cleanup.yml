name: Prune pull request caches.

on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: ["MacOS.", "MacOS Packaged.", "Linux."]
    branches: [dev]
    types: [completed]

permissions:
  {}

# Trust boundary and token scope: see .github/ci-cache-threat-model.md.
jobs:
  prune:
    name: Prune closed pull request caches
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Delete pull request cache scope.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Refusing to prune a malformed pull request cache scope."
            exit 1
          fi
          cache_ref="refs/pull/${PR_NUMBER}/merge"
          gh cache delete --all --succeed-on-no-caches --ref "$cache_ref" --repo "$GITHUB_REPOSITORY"

  prune-old-dev-macos-ccache:
    name: Prune superseded dev compiler caches
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name != 'Linux.'
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Verify the source run is trusted.
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_BRANCH" != "dev" || "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Refusing to prune caches for an untrusted workflow run."
            exit 1
          fi

      - name: Keep the newest compiler cache per profile.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_prefix='macOS-arm64-ccache-dev-'
          cache_entries="$(gh cache list \
            --limit 1000 \
            --key "$cache_prefix" \
            --ref refs/heads/dev \
            --sort created_at \
            --order desc \
            --json id,key \
            --jq '.[] | [.id, .key] | @tsv' \
            --repo "$GITHUB_REPOSITORY")"
          declare -A retained_profiles=()
          delete_cache() {
            local cache_id="$1"
            [[ "$cache_id" =~ ^[0-9]+$ ]] || {
              echo "::error::Unexpected cache ID from GitHub: $cache_id"
              exit 1
            }
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          }
          ranked_entries=''
          while IFS=$'\t' read -r cache_id cache_key; do
            [[ -n "$cache_id" ]] || continue
            if [[ ! "$cache_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected cache ID from GitHub: $cache_id"
              exit 1
            fi
            if [[ "$cache_key" =~ ^macOS-arm64-ccache-dev-(pr-compatible|protected)-[[:xdigit:]]{64}-([0-9]+)-([0-9]+)$ ]]; then
              profile="${BASH_REMATCH[1]}"
              run_id="${BASH_REMATCH[2]}"
              run_attempt="${BASH_REMATCH[3]}"
            elif [[ "$cache_key" =~ ^macOS-arm64-ccache-dev-[[:xdigit:]]{64}-([0-9]+)-([0-9]+)$ ]]; then
              # MacOS Packaged. saves this unprofiled key for release builds.
              profile=packaged
              run_id="${BASH_REMATCH[1]}"
              run_attempt="${BASH_REMATCH[2]}"
            else
              echo "::error::Unexpected dev compiler cache key: $cache_key"
              exit 1
            fi
            ranked_entries+="${run_id}"$'\t'"${run_attempt}"$'\t'"${cache_id}"$'\t'"${profile}"$'\n'
          done <<< "$cache_entries"
          # Rank by the run that saved the entry, not by save time: a run started
          # on an older dev head can finish after a newer one and must not win.
          while IFS=$'\t' read -r _ _ cache_id profile; do
            [[ -n "$cache_id" ]] || continue
            if [[ -z "${retained_profiles[$profile]:-}" ]]; then
              retained_profiles[$profile]="$cache_id"
            else
              delete_cache "$cache_id"
            fi
          done < <(printf '%s' "$ranked_entries" | sort -t $'\t' -k1,1nr -k2,2nr)

  prune-old-dev-linux-ccache:
    name: Prune superseded dev Linux compiler caches
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Linux.'
    runs-on: ubuntu-26.04
    permissions:
      actions: write

    steps:
      - name: Verify the source run is trusted.
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_BRANCH" != "dev" || "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Refusing to prune caches for an untrusted workflow run."
            exit 1
          fi

      - name: Keep the newest Linux compiler cache.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_prefix='Linux-tdesktop-default-'
          cache_entries="$(gh cache list \
            --limit 1000 \
            --key "$cache_prefix" \
            --ref refs/heads/dev \
            --sort created_at \
            --order desc \
            --json id,key \
            --jq '.[] | [.id, .key] | @tsv' \
            --repo "$GITHUB_REPOSITORY")"
          retained_id=''
          while IFS=$'\t' read -r cache_id cache_key; do
            [[ -n "$cache_id" ]] || continue
            if [[ ! "$cache_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Unexpected cache ID from GitHub: $cache_id"
              exit 1
            fi
            if [[ ! "$cache_key" =~ ^Linux-tdesktop-default-[0-9]+$ ]]; then
              echo "::error::Unexpected dev Linux compiler cache key: $cache_key"
              exit 1
            fi
            if [[ -z "$retained_id" ]]; then
              retained_id="$cache_id"
            else
              gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
            fi
          done <<< "$cache_entries"
