# actionlint 1.7.7 predates these GitHub-hosted labels, so it reports them as
# unknown. The ubuntu-slim housekeeping lanes schedule successfully (run
# 31988522844, stale.yml on dev), and ubuntu-26.04 is the pinned Ubuntu target.
# Keep both labels here rather than rewriting the workflows to ubuntu-latest.
self-hosted-runner:
  labels:
    - ubuntu-slim
    - ubuntu-26.04

# GitHub supports queue: max for concurrency groups, but the pinned actionlint
# schema predates that key. Ignore only its unknown-key diagnostic here.
paths:
  .github/workflows/mac_packaged.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
